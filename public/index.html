<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17392b">
  <meta name="description" content="WoxRadar helps Woxsen students discover campus activities and meet through shared context.">
  <title>WoxRadar · Campus, with context</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2317392b'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23d8ff48' stroke-width='5'/%3E%3Cpath d='M32 12v40M12 32h40' stroke='%23d8ff48' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23d8ff48'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="authScreen" class="auth-screen" hidden></main>
  <main id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <button class="brand" type="button" data-go="explore" aria-label="Go to WoxRadar Explore">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path><circle cx="12" cy="12" r="2"></circle></svg>
        </span>
        <span class="brand-copy"><strong>WoxRadar</strong><small>Campus, with context</small></span>
      </button>

      <label class="global-search" for="globalSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="Search campus posts…">
      </label>

      <div class="top-actions">
        <button class="icon-button notification-button" type="button" data-go="requests" aria-label="Open invitations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
          <span id="requestBadge" class="request-badge" hidden>0</span>
        </button>
        <button id="userAvatar" class="avatar-button" type="button" data-go="profile" aria-label="Open your profile">?</button>
      </div>
    </header>

    <nav id="mobileNav" class="mobile-nav" aria-label="Main navigation"></nav>

    <div class="app-grid">
      <aside class="left-sidebar">
        <p class="sidebar-label">Navigate</p>
        <nav id="desktopNav" class="desktop-nav" aria-label="Main navigation"></nav>
      </aside>

      <section id="workspace" class="workspace" aria-live="polite"></section>

      <aside class="right-sidebar">
        <section class="side-card weekly-card">
          <p class="sidebar-label no-pad">This week</p>
          <h2>Make one useful connection.</h2>
          <p>Choose an activity first, then see people who opted in to join it.</p>
          <div class="weekly-goal">
            <span class="soft-icon">
              <svg viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM16 13a4 4 0 1 0 0-8M2 21a6 6 0 0 1 12 0M14 21a5 5 0 0 1 8 0"></path></svg>
            </span>
            <p><strong id="weeklyCount">0</strong> new intros this week<small>A simple starting goal</small></p>
          </div>
        </section>

        <section class="side-card">
          <div class="side-heading"><strong>Quick filters</strong><svg viewBox="0 0 24 24"><path d="M4 4h16v4L14 14v5l-4 2v-7L4 8V4Z"></path></svg></div>
          <div class="quick-filters">
            <button type="button" data-quick="Hackathon">Hackathons</button>
            <button type="button" data-quick="Club">Clubs</button>
            <button type="button" data-quick="Borrow">Borrow</button>
            <button type="button" data-quick="Paid">Paid gigs</button>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="appModal" class="app-modal">
    <button id="modalClose" class="modal-close" type="button" aria-label="Close dialog">
      <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg>
    </button>
    <div id="modalContent"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
